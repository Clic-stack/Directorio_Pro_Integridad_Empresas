<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Directorio de Empresas Pro Integridad</title>
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>
    <div id="page-container">
    
        <header>
            <div class="title-section">
                <h1 align="center">Directorio de Empresas Pro Integridad</h1>
            </div>
            <div class="subtitle-section">
                <h2 align="center"><span id="company-count">0</span> empresas acreditadas en <span id="subtitle-category-count">0</span> rubros empresariales</h2>
            </div>
        </header>
    
        <div id="loading-screen" class="loading-screen" hidden>
            <div class="spinner">
                <div class="spinner-circle"></div>
                <p>Cargando...</p>
            </div>
        </div> 

        <!-- ===================== MENÚ DE CONTACTO (reutilizable) ===================== -->
        <div id="contact-menu" class="contact-menu" hidden>
            <div class="contact-menu-content">
                <p id="contact-menu-title"></p>
                <div id="contact-menu-options"></div>
                <button type="button" id="btn-close-contact-menu">Cerrar</button>
            </div>
        </div>
    
        <!-- ===================== FILTROS Y BUSCADOR ===================== -->
    
        <div id="searcher" class="searcher">
            <div class="searcher-content">
                <button type="button" id="btn-company">Todos</button>
                <button type="button" id="btn-category">Ver los <span id="category-company-count">0</span> rubros</button>
                <ul id="option-list" hidden>
                    <li>
                        <button type="button" data-category="Construcción, Arquitectura y Obra Civil">Construcción, Arquitectura y Obra Civil</button>
                    </li>
                    <li>
                        <button type="button" data-category="Proveedores de la Construcción, Ferretería y Materiales">Proveedores de la Construcción, Ferretería y Materiales</button>
                    </li>
                    <li>
                        <button type="button" data-category="Industria Electrónica y Manufactura Avanzada">Industria Electrónica y Manufactura Avanzada</button>
                    </li>
                    <li>
                        <button type="button" data-category="Tecnología, Software y Telecomunicaciones">Tecnología, Software y Telecomunicaciones</button>
                    </li>
                    <li>
                        <button type="button" data-category="Salud, Hospitales y Servicios Médicos">Salud, Hospitales y Servicios Médicos</button>
                    </li>
                    <li>
                        <button type="button" data-category="Industria Farmacéutica, Equipo Médico y Material de Curación">Industria Farmacéutica, Equipo Médico y Material de Curación</button>
                    </li>
                    <li>
                        <button type="button" data-category="Agroindustria, Alimentos y Bebidas (Incluye Sector Tequilero)">Agroindustria, Alimentos y Bebidas (Incluye Sector Tequilero)</button>
                    </li>
                    <li>
                        <button type="button" data-category="Transporte, Logística y Almacenamiento">Transporte, Logística y Almacenamiento</button>
                    </li>
                    <li>
                        <button type="button" data-category="Sector Automotriz, Refacciones y Talleres">Sector Automotriz, Refacciones y Talleres</button>
                    </li>
                    <li>
                        <button type="button" data-category="Servicios Jurídicos, Fiscales y Consultoría Empresarial">Servicios Jurídicos, Fiscales y Consultoría Empresarial</button>
                    </li>
                    <li>
                        <button type="button" data-category="Seguridad Privada y Gestión de Riesgos">Seguridad Privada y Gestión de Riesgos</button>
                    </li>
                    <li>
                        <button type="button" data-category="Servicios Inmobiliarios y Administración de Propiedades">Servicios Inmobiliarios y Administración de Propiedades</button>
                    </li>
                    <li>
                        <button type="button" data-category="Energía, Medio Ambiente y Sustentabilidad">Energía, Medio Ambiente y Sustentabilidad</button>
                    </li>
                    <li>
                        <button type="button" data-category="Textil, Confección, Calzado y Uniformes">Textil, Confección, Calzado y Uniformes</button>
                    </li>
                    <li>
                        <button type="button" data-category="Educación, Capacitación y Asociaciones Civiles">Educación, Capacitación y Asociaciones Civiles</button>
                    </li>
                    <li>
                        <button type="button" data-category="Marketing, Publicidad, Medios y Eventos">Marketing, Publicidad, Medios y Eventos</button>
                    </li>
                    <li>
                        <button type="button" data-category="Turismo, Hotelería y Entretenimiento">Turismo, Hotelería y Entretenimiento</button>
                    </li>
                    <li>
                        <button type="button" data-category="Muebles, Madera e Interiorismo">Muebles, Madera e Interiorismo</button>
                    </li>
                    <li>
                        <button type="button" data-category="Servicios Financieros y Seguros">Servicios Financieros y Seguros</button>
                    </li>
                    <li>
                        <button type="button" data-category="Servicios Generales y Especializados">Servicios Generales y Especializados</button>
                    </li>
                </ul>
                <form id="search-form" method="GET">
                    <label for="search-input" class="sr-only">Buscar empresa por nombre, municipio o rubro</label>
                    <span class="search-divider" aria-hidden="true">| 🔎</span>
                    <input type="text" id="search-input" placeholder="Buscar empresa por nombre, municipio o rubro...">
                    <ul id="search-suggestions"></ul>
                    <p id="error-message" class="error-message" hidden>No se encontraron empresas que coincidan con tu búsqueda</p>
                </form>
            </div>
        </div>
    
         <!-- ===================== Tarjetas de Empresas ===================== -->
    
        <div id="company-container">
            <div data-id="1" data-category="Construcción, Arquitectura y Obra Civil" data-status="Acreditada" class="company-card">
                <div class="top-card">
                    <span class="icon-card"></span>
                    <span class="badge"></span>
                    <img src="src/logo_distintivo_pro-integridad.png" alt="Distintivo Pro Integridad" class="logo-card">
                </div>
                <p class="name-card"></p>
                <p class="detail-card"></p>
                <button type="button" class="btn-contact"></button>
            </div>
        </div>
    
        <!-- ===================== Paginación ===================== -->
    
        <div id="pagination">
            <button type="button" id="btn-previous-page"> ← </button>
            <div id="page-numbers"></div>
            <button type="button" id="btn-next-page"> → </button>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
